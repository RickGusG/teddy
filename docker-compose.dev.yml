version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: teddy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: America/Sao_Paulo
    ports:
      - '5672:5672'
      - '15672:15672'

  backend:
    build: 
      context: ./teddy-test-backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./teddy-test-backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '3000:3000'
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: teddy
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NODE_ENV: development
      TZ: America/Sao_Paulo
    depends_on:
      - db
      - rabbitmq

  frontend:
    build:
      context: ./teddy-test
      dockerfile: Dockerfile.dev
    volumes:
      - ./teddy-test:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:5173
      TZ: America/Sao_Paulo
    depends_on:
      - backend

volumes:
  db_data: 